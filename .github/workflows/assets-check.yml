name: Meshy asset tooling validation

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  assets:
    name: Asset tool Docker and UV tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build the exact developer image used with Compose
        uses: docker/build-push-action@v6
        with:
          context: ./tools/assets
          file: ./tools/assets/Dockerfile
          load: true
          push: false
          tags: i-am-a-moucheron-asset-tools:local
      - name: Export generated lockfile to logs (temporary bootstrap)
        run: |
          docker run --rm --entrypoint cat i-am-a-moucheron-asset-tools:local /opt/assets/package-lock.json > /tmp/asset-lock.json
          echo ASSET_LOCK_BEGIN
          base64 -w0 /tmp/asset-lock.json
          echo
          echo ASSET_LOCK_END
      - name: Exercise textured GLB optimization in the container
        run: docker run --rm --network none --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges i-am-a-moucheron-asset-tools:local selftest
      - name: Validate Compose config
        run: docker compose -f compose.assets.yaml config --quiet
