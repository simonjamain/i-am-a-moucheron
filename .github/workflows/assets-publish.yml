name: Publish Meshy asset tools

on:
  push:
    branches: [main]
    paths:
      - 'tools/assets/**'
      - 'compose.assets.yaml'
      - '.github/workflows/assets-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Asset tools to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish versioned tool image
        uses: docker/build-push-action@v6
        with:
          context: ./tools/assets
          file: ./tools/assets/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/simonjamain/i-am-a-moucheron-asset-tools:sha-${{ github.sha }}
            ghcr.io/simonjamain/i-am-a-moucheron-asset-tools:latest
