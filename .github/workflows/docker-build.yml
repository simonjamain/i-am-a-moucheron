name: Docker build validation

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build complete runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: i-am-a-moucheron:check
          cache-from: type=gha,scope=docker-validation
          cache-to: type=gha,scope=docker-validation,mode=max

  snapshot-benchmark:
    name: 50-player snapshot comparison
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history for baseline comparison
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build game assets
        run: node scripts/assemble.mjs
      - name: Run 50-player snapshot regression
        run: node scripts/test-ram-game.mjs
      - name: Verify crowded-room motion relay behavior
        run: node scripts/test-motion-capacity.mjs
      - name: Compare baseline and current snapshot CPU time
        run: node scripts/benchmark-snapshot-50.mjs
      - name: Compare 50-player motion handling CPU time
        run: node scripts/benchmark-motion-sync-50.mjs

  udp-capacity:
    name: 50 native UDP peers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build game assets
        run: node scripts/assemble.mjs
      - name: Connect 50 real WebRTC UDP peers
        run: node scripts/test-udp-capacity-50.mjs

  physics-regression:
    name: Physics contact regression and 50x900 benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check conservative collision broad phase
        run: node scripts/test-swept-broadphase.mjs
      - name: Benchmark 50 vehicles and 900 enemies
        run: npm run bench:swarm-50
      - name: Check formatting
        run: npx prettier --check src/swept-broadphase.js server/game.js scripts/test-swept-broadphase.mjs scripts/benchmark-swept-broadphase.mjs

  game-regression:
    name: Full game regression and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Run game tests including 10k procedural swarms
        run: npm test
      - name: Check documentation
        run: npm run check:docs
      - name: Build distributable
        run: npm run build && node scripts/validate-artifact.mjs
