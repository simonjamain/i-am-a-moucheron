name: Docker build validation

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build complete runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: i-am-a-moucheron:check
          cache-from: type=gha,scope=docker-validation
          cache-to: type=gha,scope=docker-validation,mode=max

      - name: Smoke-test the built Node/UDP image
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker run --rm -d -p 127.0.0.1::3000/tcp i-am-a-moucheron:check)"
          trap 'docker logs "$cid" || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          port="$(docker port "$cid" 3000/tcp | sed -n '1s/.*://p')"
          test -n "$port"
          ready=0
          for attempt in {1..30}; do
            if curl -fsS "http://127.0.0.1:$port/healthz" -o "$RUNNER_TEMP/health.json"; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          node -e 'const a=require("node:assert/strict");const h=JSON.parse(require("node:fs").readFileSync(process.env.RUNNER_TEMP+"/health.json","utf8"));a.deepEqual([h.ok,h.storage,h.transport],[true,"ram","webrtc-udp"])'
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST "http://127.0.0.1:$port/api/join")" = "410"

  snapshot-benchmark:
    name: 50-player snapshot comparison
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history for baseline comparison
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build game assets
        run: node scripts/assemble.mjs
      - name: Run 50-player snapshot regression
        run: node scripts/test-ram-game.mjs
      - name: Verify crowded-room motion relay behavior
        run: node scripts/test-motion-capacity.mjs
      - name: Compare baseline and current snapshot CPU time
        run: node scripts/benchmark-snapshot-50.mjs
      - name: Compare 50-player motion handling CPU time
        run: node scripts/benchmark-motion-sync-50.mjs

  udp-capacity:
    name: 50 native UDP peers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build game assets
        run: node scripts/assemble.mjs
      - name: Connect 50 real WebRTC UDP peers
        run: node scripts/test-udp-capacity-50.mjs
      - name: Connect 50 real WebRTC UDP peers on one shared port
        run: UDP_MUX_PORT=44000 node scripts/test-udp-capacity-50.mjs

  physics-regression:
    name: Physics contact regression and 50x900 benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check conservative collision broad phase
        run: node scripts/test-swept-broadphase.mjs
      - name: Benchmark 50 vehicles and 900 enemies
        run: npm run bench:swarm-50

  browser-e2e:
    name: Real Chromium over WebRTC UDP/TCP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright and Chromium (CI only, not a project dependency)
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Run browser scenarios (join/resume, shared motion, TCP fallback, loading, falls, plan picker)
        run: npm run e2e

  game-regression:
    name: Full game regression and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run game tests including 10k procedural swarms
        run: npm test
      - name: Check formatting (same command as local)
        run: npm run format:check
      - name: Check documentation
        run: npm run check:docs
      - name: Build distributable
        run: npm run build && node scripts/validate-artifact.mjs
