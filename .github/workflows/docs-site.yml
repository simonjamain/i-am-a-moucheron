name: Docs site

# Builds the documentation site on every PR (strict: broken links or pages missing
# from the menu fail) and publishes it on GitHub Pages from main. See docs/site.md.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Docs site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history (page freshness)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install dependencies
        run: |
          npm ci
          pip install -r requirements-docs.txt
      - name: Assemble game assets (live UI review)
        run: node scripts/assemble.mjs
      - name: Prepare site source
        run: node scripts/build-site.mjs
      - name: Build site (strict)
        env:
          NO_MKDOCS_2_WARNING: '1'
        run: mkdocs build
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site/html

  deploy:
    name: Publish on GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
