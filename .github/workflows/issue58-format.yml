name: Temporary Issue 58 source formatting
on:
  push:
    branches:
      - feat/issue-58-ground-tower-defense
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'format(issue-58): apply prettier')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format only files changed for issue 58
        run: |
          npx prettier --write src/ground-defense.js src/ground-defense-state.js src/ground-creatures.js src/ground-defense-ui.js src/client.js src/waves.js src/changelog.js server/game.js scripts/test-ground-defense.mjs scripts/test-ground-structure.mjs scripts/test-ground-room.mjs scripts/test-ground-creatures.mjs scripts/test-changelog.mjs scripts/benchmark-snapshot-50.mjs scripts/assemble.mjs docs/gameplay.md docs/tasks/issue-58.md package.json
      - name: Commit formatted code on the contribution branch
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/ground-defense.js src/ground-defense-state.js src/ground-creatures.js src/ground-defense-ui.js src/client.js src/waves.js src/changelog.js server/game.js scripts/test-ground-defense.mjs scripts/test-ground-structure.mjs scripts/test-ground-room.mjs scripts/test-ground-creatures.mjs scripts/test-changelog.mjs scripts/benchmark-snapshot-50.mjs scripts/assemble.mjs docs/gameplay.md docs/tasks/issue-58.md package.json
            git commit -m 'format(issue-58): apply prettier'
            git push
          fi
