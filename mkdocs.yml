# Site de documentation publié sur GitHub Pages (voir docs/site.md).
# La source est préparée par `node scripts/build-site.mjs` dans `.site/src`.
# Toute nouvelle page de docs/ s'ajoute au menu ci-dessous.
site_name: i am a moucheron
site_description: Combat aérien coopératif miniature dans un bureau — documentation du jeu.
site_url: https://simonjamain.github.io/i-am-a-moucheron/
repo_url: https://github.com/simonjamain/i-am-a-moucheron
repo_name: simonjamain/i-am-a-moucheron
edit_uri: ''
docs_dir: .site/src
site_dir: .site/html
strict: true

theme:
  name: material
  language: fr
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Thème sombre
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Thème clair
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

extra_css:
  - site.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: info

nav:
  - Accueil: index.md
  - Le jeu:
      - Règles et parcours: gameplay.md
      - Commandes: controls.md
      - Vagues, puissance et magasin: progression.md
      - Bestiaire: enemy-bestiary.md
      - Plans de bureau: office-layouts.md
      - Nouveautés: nouveautes.md
  - Règles détaillées:
      - Caisse, achats et services: economy.md
      - Banque: bank.md
      - Dossiers, réserves et livraisons: logistics-contracts.md
      - Combat, PV et sièges: combat-worlds.md
      - Flotte, échelle et armement: scale-fleet-weapons.md
      - Hélicoptère H2 et DCA mobile D2: support-vehicles.md
      - Tourelle Gatling: gatling-turret.md
      - Projectiles: projectiles.md
      - 'Nuées : composition et mouvement': dense-swarms.md
      - Statistiques des équipements: stats.md
      - File du purgatoire: purgatory-queue.md
      - Ciel du purgatoire: purgatory-sky.md
      - Mode debug: laboratory.md
  - Conception:
      - Direction artistique: art-direction.md
      - Règles d’interface: ui-guidelines.md
      - Galerie visuelle: galerie.md
      - Écrans intégrés: ecrans.md
      - Écran de chargement: loading-screen.md
      - Rendu WebGPU: webgpu.md
      - Éclairage et ombres du bureau: office-lighting.md
      - Décor du purgatoire: purgatory-scene.md
      - Audio: audio.md
      - Pipeline des assets 3D: asset-pipeline.md
      - Catalogue des modèles 3D: models.md
  - Technique:
      - Présentation du projet: projet.md
      - Carte du code: code-structure.md
      - Confiance envers les clients: trust-model.md
      - Autorité et corps partagés: walking-network.md
      - Serveur et transport: udp-server.md
      - Physique Rapier: physics-engine.md
      - Vol des avions sur Rapier: plane-physics.md
      - Vol des hélicoptères sur Rapier: heli-physics.md
      - Rubans d'air et décrochage: air-ribbons.md
      - Collisions sur les triangles: collisions.md
      - Insectes et Rapier: insects-rapier.md
      - Affichage de la physique: physics-debug.md
      - Performances: performance.md
      - TypeScript: typescript.md
  - Contribuer:
      - Contribuer: contribuer.md
      - Consignes des agents: agents.md
      - Exploitation et vérifications: operations.md
      - Docker: docker.md
      - Version et nouveautés: changelog.md
      - Ajouter du contenu: adding-content.md
      - Site de documentation: site.md
      - Santé de la documentation: sante.md
      - Tâches en cours:
          - tasks/README.md
          - tasks/typescript-migration.md
